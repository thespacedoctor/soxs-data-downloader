name: Tests

permissions:
  contents: read

# A CHANGE THAT TOUCHES ONLY CHANGES.md SKIPS THIS WORKFLOW
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "CHANGES.md"
  pull_request:
    paths-ignore:
      - "CHANGES.md"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80
